---
- hosts: debian
  become: true
  pre_tasks:
    - name: Freeze the current timestamp once
      ansible.builtin.set_fact:
        current_date: "{{ now(fmt='%Y%m%d%H%M_%S') }}" # Generates a string like "2026-09-04_1458_23"
      run_once: true  # Ensures all hosts share the exact same timestamp
      
  tasks:
    - name: Check instance connectivity (skip if target is down)
      ansible.builtin.wait_for_connection:
        timeout: 35
      ignore_unreachable: true
      register: reachability_check

    - name: This Task only runs if instance = reachable
      ansible.builtin.debug:
        msg: "Host is reachable!"
      when: reachability_check is not unreachable

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: MISC touch backup file with date so it exists
      ansible.builtin.file:
        path: "/root/ansible-packages-to-upgrade-{{ current_date }}.log"
        state: touch

    - name: Log packages to be upgraded to dated file
      ansible.builtin.shell: "apt-get -s upgrade > /root/ansible-packages-to-upgrade-{{ current_date }}.log"
      register: pkgstoupgrade

    - name: Log packages to be upgraded
      ansible.builtin.command: cat /root/ansible-packages-to-upgrade-{{ current_date }}.log
      register: command_output
      changed_when: false # Prevents the task from showing a "changed" status

    - name: Print the packages to be upgraded
      ansible.builtin.debug:
        var: command_output.stdout
#      ansible.builtin.debug:
#        msg: "{{ pkgstoupgrade.stdout }}"

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: full
        autoremove: yes
        autoclean: yes
      register: apt_result
      timeout: 1500 # 25 min
      
    - name: Show apt output
      ansible.builtin.debug:
        var: apt_result

    - name: Check if a reboot is needed
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the server if required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible for system updates"
        connect_timeout: 5
        reboot_timeout: 360
        test_command: uptime
      when: reboot_required.stat.exists
